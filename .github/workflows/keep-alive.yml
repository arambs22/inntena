name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Render's free web service sleeps after 15 min with no traffic and
      # takes ~30-60s to wake on the next request. A ping every 10 minutes
      # keeps it under that threshold so it never goes to sleep.
      - name: Ping health endpoint
        run: |
          curl --fail --max-time 30 --retry 2 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/json" \
            "${{ secrets.NICHERADAR_URL }}/health"
