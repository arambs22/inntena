name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint

      # --omit=dev: audit only what actually ships to production. Advisories
      # in dev-only tooling (Vitest/tinypool, drizzle-kit/esbuild) never run
      # on the deployed server and are tracked through Dependabot instead.
      # audit-level=high: only new high/critical findings in production
      # dependencies should break the build.
      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Typecheck frontend
        run: npm run typecheck --prefix client

      - name: Lint frontend
        run: npm run lint --prefix client

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high --prefix client

      - name: Test frontend
        run: npm test --prefix client

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inntena
          POSTGRES_PASSWORD: inntena
          POSTGRES_DB: inntena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Write .env.test
        run: cp .env.test.example .env.test

      - name: Typecheck test files
        run: npm run typecheck:test

      - name: Run tests
        run: npm test
